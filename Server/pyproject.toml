[project]
name = "autism-insight"
version = "0.1.0"
description = "Evidence-grounded conversational support with LangGraph and pgvector"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy[asyncio]>=2.0.38,<3",
  "psycopg[binary]>=3.2.6,<4",
  "pgvector>=0.4,<1",
  "alembic>=1.15,<2",
  "langchain>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langchain-text-splitters>=1.0,<2",
  "langgraph>=1.0,<2",
  "pypdf>=5.4,<7",
  "tiktoken>=0.9,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.26,<2", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires TEST_DATABASE_URL with pgvector"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
