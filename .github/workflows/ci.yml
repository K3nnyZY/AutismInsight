name: Verify
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        env:
          POSTGRES_USER: autism
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: autism_insight_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U autism -d autism_insight_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg://autism:test-only@localhost:5432/autism_insight_test
      DATABASE_URL: postgresql+psycopg://autism:test-only@localhost:5432/autism_insight_test
      OPENAI_API_KEY: ""
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.14"}
      - run: pip install -r Server/requirements-dev.lock
      - run: pip install --no-deps -e Server
      - run: ruff check Server
      - run: ruff format --check Server
      - run: cd Server && alembic upgrade head
      - run: pytest Server/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24", cache: npm, cache-dependency-path: Client/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
